<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario</title>
</head>
<body>
   <center> <p>Preencha o formulário abaixo para fazer login</p>
<div class="fm">
    <form id="simpleform" onsubmit="return validateform">
        <fieldset>
            <legend>Cadastro</legend>

            <label for="nome">Nome Completo:</label> <br>
            <input type="text" id="nome" name="nome" placeholder="nome"><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="email"><br> <br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="password" placeholder="Senha"><br> <br>

            <label for="confirmsenha">Confirmar senha:</label><br>
            <input type="password" id="confirmsenha" name="password" placeholder="Confirmar senha"><br> <br>

            <button type="submit">Cadastrar</button>

            <p id="error-message"></p>

        </fieldset>
</div>
</center>
       <script src="script.js"></script> 
</body>
</html>

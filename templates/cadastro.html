<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Produto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Produto</h1>

    <form action="/salvar" method="POST">
      <label for="nome">Nome do Produto:</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Camisa Vermelha" required>

      <label for="preco">Preço:</label>
      <input type="number" id="preco" name="preco" step="0.01" placeholder="Ex: 49.90" required>

      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 10" required>

      <button type="submit">Salvar Produto</button>
    </form>

    <a href="/" class="voltar">← Voltar à Lista</a>
  </div>
</body>
</html>

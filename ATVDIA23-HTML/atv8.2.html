<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Site - Contato do grau </title>
</head>
<body>
<center>
    <header>
        <img src="img/images.jpg" alt="Logo do Mini-Site"  width="150" height="150">
        <h1>Formulário de Contato do grau</h1>
    
    </header>

    <form action="/enviar" method="post">
        <fieldset>
            <legend>Dados do Usuário</legend>

            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem"></textarea><br><br>

            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto">
                <option value="produto">Produto</option>
                <option value="servico">Serviço</option>
                <option value="duvida">Dúvida</option>
                <option value="outro">Outro</option>
            </select><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>

    <p><a href="atv8.1.html">Voltar à Home</a></p>
</center>
</body>
</html>

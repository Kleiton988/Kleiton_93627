<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição para o Evento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #444;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"] {
            width: 95%;
            padding: 6px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        .grupo-opcoes {
            margin-top: 5px;
        }
        input[type="submit"] {
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background: #45a049;
        }
        .confirmacao {
            margin-top: 20px;
            background: #dff0d8;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            color: #3c763d;
        }
    </style>
</head>
<body>

    <h1>Inscrição para o Evento</h1>
    <p>Preencha o formulário abaixo para garantir sua vaga no nosso evento especial. 
       Sua inscrição nos ajuda a organizar as atividades e oferecer a melhor experiência possível.</p>

    <form action="/inscricao" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefone">Número de Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>

            <label>Gênero:</label>
            <div class="grupo-opcoes">
                <input type="radio" id="masculino" name="genero" value="Masculino">
                <label for="masculino">Masculino</label><br>
                <input type="radio" id="feminino" name="genero" value="Feminino">
                <label for="feminino">Feminino</label><br>
                <input type="radio" id="outro" name="genero" value="Outro">
                <label for="outro">Outro</label>
            </div>

            <label>Interesse no Evento:</label>
            <div class="grupo-opcoes">
                <input type="checkbox" id="palestras" name="interesse" value="Palestras">
                <label for="palestras">Palestras</label><br>
                <input type="checkbox" id="workshops" name="interesse" value="Workshops">
                <label for="workshops">Workshops</label><br>
                <input type="checkbox" id="networking" name="interesse" value="Networking">
                <label for="networking">Networking</label>
            </div>

            <label for="data">Data de Participação:</label>
            <input type="date" id="data" name="data" required>
        </fieldset>

        <input type="submit" value="Enviar Inscrição">
    </form>

    <!-- Mensagem de confirmação (apenas ilustrativa) -->
    <div class="confirmacao">
        Sua inscrição foi recebida com sucesso!
    </div>

</body>
</html>
